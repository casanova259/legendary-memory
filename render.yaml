# Render.com Blueprint for LivSportz Monorepo
services:
  # 1. Express + WebSocket Backend Service
  - type: web
    name: livsportz-backend
    runtime: node
    plan: starter
    region: oregon
    buildCommand: cd backend && npm ci --omit=dev
    startCommand: cd backend && node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: ADMIN_BOOTSTRAP_SECRET
        sync: false
      - key: ARCJET_KEY
        sync: false
      - key: ARCJET_ENV
        value: production
      - key: ARCJET_MODE
        value: LIVE
      - key: CLIENT_URL
        fromService:
          type: web
          name: livsportz-frontend
          property: host
    healthCheckPath: /healthz

  # 2. Vite React Frontend Static Site
  - type: web
    name: livsportz-frontend
    runtime: static
    plan: starter
    region: oregon
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: livsportz-backend
          property: host
      - key: VITE_WS_BASE_URL
        fromService:
          type: web
          name: livsportz-backend
          property: host
