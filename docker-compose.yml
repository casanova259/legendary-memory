services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: livsportz-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - ARCJET_KEY=${ARCJET_KEY}
      - ARCJET_ENV=production
      - ARCJET_MODE=LIVE
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: livsportz-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
